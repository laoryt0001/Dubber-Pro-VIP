name: Dubber Pro VIP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Syntax and verification check
        run: |
          node --check server.js
          node --check db.js
          node --check cryptoUtils.js
          node --check licenseClient.js
          node --check cli.js
